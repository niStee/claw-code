router_settings:
  num_retries: 0
  allowed_fails: 1
  cooldown_time: 1800
  fallbacks:
    - "claw-opus": ["gpt-5.3-codex", "vscode-auto", "deepseek-v4-pro"]
    - "claw-sonnet": ["gpt-5.4-mini", "vscode-auto", "aistudio-gemini-3-flash-preview", "deepseek-v4-pro"]
    - "claw-haiku": ["vscode-auto", "deepseek-v4-flash"]
    - "claw-pro": ["gpt-5.3-codex", "vscode-auto", "deepseek-v4-pro"]
    - "gpt-5.5": ["gpt-5.3-codex", "vscode-auto", "deepseek-v4-pro"]
    - "gpt-5.4": ["gpt-5.4-mini", "vscode-auto", "aistudio-gemini-3-flash-preview", "deepseek-v4-pro"]
    - "gpt-5.4-mini": ["vscode-auto", "aistudio-gemini-3-flash-preview", "deepseek-v4-pro"]
    - "gpt-5.3-codex": ["gpt-5.4-mini", "vscode-auto", "deepseek-v4-pro"]
    - "gpt-5.2": ["vscode-auto", "deepseek-v4-pro"]
    - "gpt-5-codex": ["gpt-5.4-mini", "vscode-auto", "deepseek-v4-pro"]
    - "gpt-5-codex-mini": ["vscode-auto", "deepseek-v4-pro"]
    - "vscode-auto": ["aistudio-gemini-3-flash-preview", "deepseek-v4-pro"]
    - "vscode-gpt-5.2": ["vscode-auto", "deepseek-v4-pro"]
    - "vscode-gpt-5.4-mini": ["vscode-auto", "deepseek-v4-pro"]
    - "vscode-gemini-3.1-pro-preview": ["vscode-auto", "deepseek-v4-pro"]
    - "vscode-gpt-5-mini": ["vscode-auto", "deepseek-v4-flash"]
    - "vscode-gpt-4.1": ["vscode-auto", "deepseek-v4-flash"]
    - "vscode-gpt-4o-mini": ["vscode-auto", "deepseek-v4-flash"]
    - "vscode-claude-haiku": ["deepseek-v4-flash"]
    - "aistudio-gemini-3-flash-preview": ["vscode-auto", "deepseek-v4-pro"]
    - "aistudio-gemini-3.1-flash-lite": ["vscode-auto", "deepseek-v4-flash"]
    - "aistudio-gemini-2.5-flash-lite": ["vscode-auto", "deepseek-v4-flash"]

litellm_settings:
  drop_params: true
  set_verbose: false
