# LiteLLM Proxy Configuration - Claw quota-first routing
#
# Goal: spend subscription / free-quota providers first, while treating each
# subscription as a quota bucket. We allow one conservative same-provider
# fallback where docs/logs show smaller models may have more headroom, then
# switch provider instead of hammering sibling models in an exhausted bucket.
# Vertex/Cloud remains direct test access while billing is disabled. DeepSeek
# stays pay-as-you-go overflow only.
#
# Launcher: scripts/claw-unified-proxy.bat

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

model_list:
  # Public Claw model groups. Each tier has its own capability/cost lane:
  #   claw-opus   heavy reasoning and complex implementation
  #   claw-sonnet everyday coding and review
  #   claw-haiku  lightweight tool calling and quick edits
  # They favor currently callable subscription/free-quota routes first, then
  # DeepSeek pay-as-you-go overflow.
  - model_name: claw-opus
    litellm_params:
      model: openai/gpt-5.5
      api_base: os.environ/CODEX_PROXY_BASE_URL
      api_key: os.environ/CODEX_PROXY_API_KEY
    model_info:
      id: claw-opus-codex-gpt-55

  - model_name: claw-sonnet
    litellm_params:
      model: openai/gpt-5.4
      api_base: os.environ/CODEX_PROXY_BASE_URL
      api_key: os.environ/CODEX_PROXY_API_KEY
    model_info:
      id: claw-sonnet-codex-gpt-54

  - model_name: claw-haiku
    litellm_params:
      model: openai/gemini-3.1-flash-lite
      api_base: https://generativelanguage.googleapis.com/v1beta/openai/
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      id: claw-haiku-aistudio-gemini-31-flash-lite

  - model_name: claw-pro
    litellm_params:
      model: openai/gpt-5.5
      api_base: os.environ/CODEX_PROXY_BASE_URL
      api_key: os.environ/CODEX_PROXY_API_KEY
    model_info:
      id: claw-pro-codex-gpt-55

  # ChatGPT Plus via local codex-proxy direct access.
  - model_name: gpt-5.5
    litellm_params:
      model: openai/gpt-5.5
      api_base: os.environ/CODEX_PROXY_BASE_URL
